AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Consolidated SAM template — single CloudFront for website + all APIs. Keep resources unchanged; single CFDistribution.

Parameters:
  FrontendDomainName:
    Type: String
    Default: containerbazar.com

Globals:
  Function:
    # Default for most Python lambdas
    Runtime: python3.12
    Timeout: 60
    MemorySize: 512
    Architectures: [arm64]

Resources:

  #################################
  # APIs (kept separate for now)
  ################################

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-ApiGatewayCWRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}-prod"
      RetentionInDays: 14

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    DependsOn: ApiGatewayCloudWatchRole
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn
  Api:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccount
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods: [ GET, POST, OPTIONS ]
        AllowHeaders: [ "*" ]
        AllowOrigins: [ "*" ]

  RentApi:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccount
    Properties:
      Name: !Sub "${AWS::StackName}-RentApi"
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true


  SellApi:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccount
    Properties:
      Name: !Sub "${AWS::StackName}-SellApi"
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
  

  #################################
  # DynamoDB Tables
  #################################
  NewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: ts
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: ts
          KeyType: RANGE
      TableName: !Sub "${AWS::StackName}-news"

  PricesOnloadTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: route
          AttributeType: S
      KeySchema:
        - AttributeName: route
          KeyType: HASH
      TableName: !Sub "${AWS::StackName}-prices-onload"

  PricesOffloadTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: route
          AttributeType: S
      KeySchema:
        - AttributeName: route
          KeyType: HASH
      TableName: !Sub "${AWS::StackName}-prices-offload"

  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: booking_id
          AttributeType: S
      KeySchema:
        - AttributeName: booking_id
          KeyType: HASH
      TableName: !Sub "${AWS::StackName}-bookings"

  PortsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: country
          AttributeType: S
        - AttributeName: name
          AttributeType: S
      KeySchema:
        - AttributeName: country
          KeyType: HASH
        - AttributeName: name
          KeyType: RANGE
      TableName: !Sub "${AWS::StackName}-ports"

  PortsTableV2:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-ports-v2"
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: state
          AttributeType: S
        - AttributeName: scIndexed
          AttributeType: S
        - AttributeName: city
          AttributeType: S
        - AttributeName: cityIndexed
          AttributeType: S
        - AttributeName: name_lc
          AttributeType: S
        - AttributeName: pincode
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI_StateCity
          KeySchema:
            - AttributeName: state
              KeyType: HASH
            - AttributeName: scIndexed
              KeyType: RANGE
          Projection: { ProjectionType: ALL }
        - IndexName: GSI_City
          KeySchema:
            - AttributeName: city
              KeyType: HASH
            - AttributeName: cityIndexed
              KeyType: RANGE
          Projection: { ProjectionType: ALL }
        - IndexName: GSI_Name
          KeySchema:
            - AttributeName: name_lc
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection: { ProjectionType: ALL }
        - IndexName: GSI_Pincode
          KeySchema:
            - AttributeName: pincode
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection: { ProjectionType: ALL }

  # Tracker / submission tables
  SubmissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TableName: !Sub "${AWS::StackName}-submissions"
      SSESpecification: { SSEEnabled: true }

  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: container
          AttributeType: S
      KeySchema:
        - AttributeName: container
          KeyType: HASH
      TableName: !Sub "${AWS::StackName}-cache"
      SSESpecification: { SSEEnabled: true }

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phone
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: phone
          KeyType: HASH
      TableName: !Sub "${AWS::StackName}-users"
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection: { ProjectionType: ALL }
      SSESpecification: { SSEEnabled: true }

  # Rentals / Sell listings tables
  RentListingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: listingId
          AttributeType: S
      KeySchema:
        - AttributeName: listingId
          KeyType: HASH
      TableName: !Sub "${AWS::StackName}-RentListings"

  SellListingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: listingId
          AttributeType: S
      KeySchema:
        - AttributeName: listingId
          KeyType: HASH
      TableName: !Sub "${AWS::StackName}-SellListings"

  RentBookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: booking_id
          AttributeType: S
      KeySchema:
        - AttributeName: booking_id
          KeyType: HASH
      TableName: !Sub "${AWS::StackName}-rent-bookings"

  SellBookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: booking_id
          AttributeType: S
      KeySchema:
        - AttributeName: booking_id
          KeyType: HASH
      TableName: !Sub "${AWS::StackName}-sell-bookings"

  BookingNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-booking-notifications"

  BookingAdminEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref BookingNotificationsTopic
      Protocol: email
      Endpoint: sachinkapoor2025@gmail.com

  #################################
  # S3 Buckets
  #################################
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-web"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  RentMediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-rent-media"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: ["GET", "PUT", "HEAD"]
            AllowedOrigins: ["*"]
            MaxAge: 3000

  SellMediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-sell-media"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: ["GET", "PUT", "HEAD"]
            AllowedOrigins: ["*"]
            MaxAge: 3000

  #################################
  # Cognito (rent/sell)
  #################################
  RentUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-Renters"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true

  RentUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: web
      UserPoolId: !Ref RentUserPool
      GenerateSecret: false

      # REQUIRED for Hosted UI
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - implicit
        - code

      AllowedOAuthScopes:
        - openid
        - email
        - profile

      SupportedIdentityProviders:
      - COGNITO

      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

      CallbackURLs:
        - !Sub "https://${FrontendDomainName}/rent/callback"
        - !Sub "https://${FrontendDomainName}/rent/new.html"

      LogoutURLs:
        - !Sub "https://${FrontendDomainName}"
        - !Sub "https://${FrontendDomainName}/auth/logout-success.html"

  RentDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: containerbazar-rent-club-auth
      UserPoolId: !Ref RentUserPool

  RentAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admin
      UserPoolId: !Ref RentUserPool

  RentEmployeeGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Employee
      UserPoolId: !Ref RentUserPool
  SellUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-Sellers"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true

  SellUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: web
      UserPoolId: !Ref SellUserPool
      GenerateSecret: false

      # REQUIRED for Hosted UI
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - implicit
        - code

      AllowedOAuthScopes:
        - openid
        - email
        - profile

      SupportedIdentityProviders:
      - COGNITO

      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

      CallbackURLs:
        - !Sub "https://${FrontendDomainName}/auth/callback"
        - !Sub "https://${FrontendDomainName}/sell/callback"
        - !Sub "https://${FrontendDomainName}/sell/new.html"

      LogoutURLs:
        - !Sub "https://${FrontendDomainName}"
        - !Sub "https://${FrontendDomainName}/auth/logout-success.html"

  SellDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: containerbazar-sell-club-auth
      UserPoolId: !Ref SellUserPool

  SellCognitoAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admin
      UserPoolId: !Ref SellUserPool

  SellCognitoEmployeeGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Employee
      UserPoolId: !Ref SellUserPool

  SiteOAC:
  Type: AWS::CloudFront::OriginAccessControl
  Properties:
    OriginAccessControlConfig:
      Name: !Sub "${AWS::StackName}-oac"
      Description: Access S3 bucket securely from CloudFront
      SigningBehavior: always
      SigningProtocol: sigv4
      OriginAccessControlOriginType: s3

  CFDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt SiteOAC.Id
          - Id: ApiOrigin
            DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [ TLSv1.2 ]
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [ GET, HEAD, OPTIONS ]
          CachedMethods: [ GET, HEAD ]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        CacheBehaviors:
          - PathPattern: "/api/*"
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [ GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE ]
            CachedMethods: [ GET, HEAD, OPTIONS ]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
        PriceClass: PriceClass_100




ListListingsFunction:
  Type: AWS::Serverless::Function
  Properties:
    CodeUri: functions/rent/list/
    Handler: app.handler
    Runtime: python3.12
    Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref RentListingsTable
    Environment:
      Variables:
        TABLE_NAME: !Ref RentListingsTable
    Events:
      ApiEvent:
        Type: Api
        Properties:
          Path: /rent/listings
          Method: GET
          RestApiId: !Ref RentApi

CreateListingFunction:
  Type: AWS::Serverless::Function
  Properties:
    CodeUri: functions/rent/create/
    Handler: app.handler
    Runtime: python3.12
    Policies:
      - DynamoDBWritePolicy:
          TableName: !Ref RentListingsTable
    Environment:
      Variables:
        TABLE_NAME: !Ref RentListingsTable
    Events:
      ApiEvent:
        Type: Api
        Properties:
          Path: /rent/listings
          Method: POST
          RestApiId: !Ref RentApi

PresignUploadFunction:
  Type: AWS::Serverless::Function
  Properties:
    CodeUri: functions/rent/presign/
    Handler: app.handler
    Runtime: python3.12
    Policies:
      - S3CrudPolicy:
          BucketName: !Ref RentMediaBucket
    Environment:
      Variables:
        BUCKET_NAME: !Ref RentMediaBucket
    Events:
      ApiEvent:
        Type: Api
        Properties:
          Path: /rent/presign
          Method: POST
          RestApiId: !Ref RentApi

  ApiFunc:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda/index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SubmissionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CacheTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        GetCarriers:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/carriers
            Method: GET
        Resolve:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/resolve
            Method: POST
        InitTrack:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/track/init
            Method: POST
        TrackDetails:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/track/details
            Method: POST



  # ---------- DynamoDB ----------
  SubmissionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification: { SSEEnabled: true }

  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: container
          AttributeType: S
      KeySchema:
        - AttributeName: container
          KeyType: HASH
      SSESpecification: { SSEEnabled: true }

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phone
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: phone
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification: { SSEEnabled: true }

  # ---------- S3 + CloudFront ----------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true


  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServiceGet
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: "s3:GetObject"
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CFDistribution}"

Outputs:
  CloudFrontURL:
    Value: !Sub "https://${CFDistribution.DomainName}"
  WebBucketName:
    Value: !Ref WebBucket
  ApiInvokeURL:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UsersTableName:
    Value: !Ref UsersTable


# === AUTO-ADDED RESOURCES: Sell ===
SellListingsTable:
  Type: AWS::DynamoDB::Table
  Properties:
    BillingMode: PAY_PER_REQUEST
    AttributeDefinitions:
      - AttributeName: listingId
        AttributeType: S
    KeySchema:
      - AttributeName: listingId
        KeyType: HASH
    TableName: !Sub "${AWS::StackName}-SellListings"

SellMediaBucket:
  Type: AWS::S3::Bucket
  Properties:
    CorsConfiguration:
      CorsRules:
        - AllowedHeaders: ["*"]
          AllowedMethods: ["GET", "PUT", "HEAD"]
          AllowedOrigins: ["*"]
          MaxAge: 3000



SellApi:
  Type: AWS::Serverless::Api
  Properties:
    Name: !Sub "${AWS::StackName}-SellApi"
    StageName: prod
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'*'"
      AllowOrigin: "'*'"

SellListListingsFunction:
  Type: AWS::Serverless::Function
  Properties:
    CodeUri: functions/sell/list/
    Handler: app.handler
    Runtime: python3.12
    Policies:
      - DynamoDBReadPolicy:
          TableName: !Ref SellListingsTable
    Environment:
      Variables:
        TABLE_NAME: !Ref SellListingsTable
    Events:
      ApiEvent:
        Type: Api
        Properties:
          Path: /sell/listings
          Method: GET
          RestApiId: !Ref SellApi

SellCreateListingFunction:
  Type: AWS::Serverless::Function
  Properties:
    CodeUri: functions/sell/create/
    Handler: app.handler
    Runtime: python3.12
    Policies:
      - DynamoDBWritePolicy:
          TableName: !Ref SellListingsTable
    Environment:
      Variables:
        TABLE_NAME: !Ref SellListingsTable
    Events:
      ApiEvent:
        Type: Api
        Properties:
          Path: /sell/listings
          Method: POST
          RestApiId: !Ref SellApi

SellPresignUploadFunction:
  Type: AWS::Serverless::Function
  Properties:
    CodeUri: functions/sell/presign/
    Handler: app.handler
    Runtime: python3.12
    Policies:
      - S3CrudPolicy:
          BucketName: !Ref SellMediaBucket
    Environment:
      Variables:
        BUCKET_NAME: !Ref SellMediaBucket
    Events:
      ApiEvent:
        Type: Api
        Properties:
          Path: /sell/presign
          Method: POST
          RestApiId: !Ref SellApi
